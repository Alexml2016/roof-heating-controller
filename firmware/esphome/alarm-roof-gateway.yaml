# Alarm & Roof Gateway — ETOR 5x2-sample laboratory diagnostics, 2026-10-23
# Laboratory build: GPIO17/OneWire confirmed on CN3; excitation GPIO32/33 verified by bench response (check PCB revision).
# Laboratory-only wetness measurement; roof contactor automation disabled.
# For electrical bench work disconnect mains/contactors and ETOR heater power.
substitutions:
  device_name: alarm-roof-gateway
  friendly_name: "Alarm & Roof Gateway"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_off: roof_contactor
      - switch.turn_off: etor_heater_relay
      - switch.turn_off: etor_excitation_a
      - switch.turn_off: etor_excitation_b

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: DEBUG

api:

ota:
  - platform: esphome

# Temporary Wi-Fi during laboratory testing.
# ethernet:
#   type: LAN8720
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18
#   clk:
#     pin: GPIO0
#     mode: CLK_OUT
#   phy_addr: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Alarm-Roof-Gateway"
    password: !secret fallback_ap_password

captive_portal:

globals:
  - id: etor_a_forward
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_b_forward
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_a_reverse
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_b_reverse
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_signal
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_sample_seq
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: etor_resistance_kohm
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: etor_state
    type: std::string
    restore_value: no
    initial_value: '"UNAVAILABLE"'

  # Five ADC readings per polarity; averages and min/max differential checks.
  - id: etor_forward_a_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_forward_b_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_reverse_a_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_reverse_b_sum
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_forward_diff_min
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_forward_diff_max
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_reverse_diff_min
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_reverse_diff_max
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_rail_fault
    type: bool
    restore_value: no
    initial_value: "false"
  - id: etor_nonfinite_fault
    type: bool
    restore_value: no
    initial_value: "false"
  - id: etor_invalid_reason
    type: std::string
    restore_value: no
    initial_value: '"NONE"'

  # Deliberately disabled until real ETOR-55 wet/dry thresholds are approved.
  - id: etor_classification_enabled
    type: bool
    restore_value: no
    initial_value: "false"
  # Calibration parameters must be explicitly set before enabling classification.
  # With decreasing metric, WET is entered below wet_on; DRY above dry_on.
  - id: etor_wet_on_metric
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_dry_on_metric
    type: float
    restore_value: no
    initial_value: "0.0"

switch:
  - platform: gpio
    id: roof_contactor
    name: "Roof heating contactor"
    pin: GPIO4
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: etor_heater_relay
    name: "ETOR-55 heater"
    pin: GPIO15
    restore_mode: ALWAYS_OFF

  # ETOR GPIO32/GPIO33 excitation has shown correct resistor-bench response; verify PCB connections on next revision.
  - platform: gpio
    id: etor_excitation_a
    internal: true
    pin: GPIO32
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: etor_excitation_b
    internal: true
    pin: GPIO33
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: "Alarm input"
    id: alarm_input
    device_class: problem
    pin:
      number: GPIO14
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: status
    name: "Controller online"

one_wire:
  # GPIO17 confirmed by scan of two DS18B20 sensors on CN3 (2026-10-21).
  - platform: gpio
    pin: GPIO17
    id: onewire_bus

sensor:
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x9a000000b176a128
    name: "Boiler temperature IN"
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x250000005219a128
    name: "Boiler temperature OUT"

    update_interval: 10s

  - platform: adc
    id: etor_a_adc
    internal: true
    pin: GPIO35
    attenuation: 12db
    update_interval: never

  - platform: adc
    id: etor_b_adc
    internal: true
    pin: GPIO36
    attenuation: 12db
    update_interval: never

  - platform: template
    id: etor_a_forward_sensor
    name: "ETOR A forward voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_a_forward);

  - platform: template
    id: etor_b_forward_sensor
    name: "ETOR B forward voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_b_forward);

  - platform: template
    id: etor_a_reverse_sensor
    name: "ETOR A reverse voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_a_reverse);

  - platform: template
    id: etor_b_reverse_sensor
    name: "ETOR B reverse voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_b_reverse);

  - platform: template
    id: etor_signal_sensor
    name: "ETOR differential signal"
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_signal);

  - platform: template
    id: etor_resistance_sensor
    name: "ETOR electrode resistance (estimated)"
    unit_of_measurement: "kΩ"
    icon: "mdi:resistor"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return id(etor_resistance_kohm);

  - platform: uptime
    name: "Controller uptime"
    update_interval: 60s

text_sensor:
  - platform: template
    id: etor_state_sensor
    name: "ETOR moisture diagnostic state"
    icon: "mdi:water-check"
    update_interval: never
    lambda: |-
      return id(etor_state);

interval:
  - interval: 10s
    then:
      # Turn excitation off before taking any readings.
      - switch.turn_off: etor_excitation_a
      - switch.turn_off: etor_excitation_b
      - delay: 100ms
      - lambda: |-
          id(etor_forward_a_sum) = 0.0f;
          id(etor_forward_b_sum) = 0.0f;
          id(etor_reverse_a_sum) = 0.0f;
          id(etor_reverse_b_sum) = 0.0f;
          id(etor_forward_diff_min) = 10.0f;
          id(etor_forward_diff_max) = -10.0f;
          id(etor_reverse_diff_min) = 10.0f;
          id(etor_reverse_diff_max) = -10.0f;
          id(etor_rail_fault) = false;
          id(etor_nonfinite_fault) = false;
          id(etor_invalid_reason) = "NONE";

      # Forward: GPIO32=HIGH, GPIO33=LOW; wait 300ms for settling.
      - switch.turn_on: etor_excitation_a
      - delay: 300ms
      - repeat:
          count: 5
          then:
            - component.update: etor_a_adc
            - component.update: etor_b_adc
            - lambda: |-
                const float a = id(etor_a_adc).state;
                const float b = id(etor_b_adc).state;
                if (!std::isfinite(a) || !std::isfinite(b)) {
                  id(etor_nonfinite_fault) = true;
                } else {
                  id(etor_forward_a_sum) += a;
                  id(etor_forward_b_sum) += b;
                  const float d = a - b;
                  if (d < id(etor_forward_diff_min)) id(etor_forward_diff_min) = d;
                  if (d > id(etor_forward_diff_max)) id(etor_forward_diff_max) = d;
                  // Two ADC inputs at the same rail cannot prove electrode resistance.
                  if ((a <= 0.18f && b <= 0.18f) ||
                      (a >= 3.12f && b >= 3.12f)) id(etor_rail_fault) = true;
                }
            - delay: 40ms
      - lambda: |-
          id(etor_a_forward) = id(etor_forward_a_sum) / 5.0f;
          id(etor_b_forward) = id(etor_forward_b_sum) / 5.0f;

      # Reverse: GPIO32=LOW, GPIO33=HIGH.
      - switch.turn_off: etor_excitation_a
      - switch.turn_on: etor_excitation_b
      - delay: 300ms
      - repeat:
          count: 5
          then:
            - component.update: etor_a_adc
            - component.update: etor_b_adc
            - lambda: |-
                const float a = id(etor_a_adc).state;
                const float b = id(etor_b_adc).state;
                if (!std::isfinite(a) || !std::isfinite(b)) {
                  id(etor_nonfinite_fault) = true;
                } else {
                  id(etor_reverse_a_sum) += a;
                  id(etor_reverse_b_sum) += b;
                  const float d = a - b;
                  if (d < id(etor_reverse_diff_min)) id(etor_reverse_diff_min) = d;
                  if (d > id(etor_reverse_diff_max)) id(etor_reverse_diff_max) = d;
                  if ((a <= 0.18f && b <= 0.18f) ||
                      (a >= 3.12f && b >= 3.12f)) id(etor_rail_fault) = true;
                }
            - delay: 40ms
      - switch.turn_off: etor_excitation_b
      - lambda: |-
          id(etor_a_reverse) = id(etor_reverse_a_sum) / 5.0f;
          id(etor_b_reverse) = id(etor_reverse_b_sum) / 5.0f;
          const float forward = id(etor_a_forward) - id(etor_b_forward);
          const float reverse = id(etor_a_reverse) - id(etor_b_reverse);
          const float delta = forward - reverse;
          id(etor_signal) = fabsf(delta);

      - sensor.template.publish:
          id: etor_a_forward_sensor
          state: !lambda "return id(etor_a_forward);"
      - sensor.template.publish:
          id: etor_b_forward_sensor
          state: !lambda "return id(etor_b_forward);"
      - sensor.template.publish:
          id: etor_a_reverse_sensor
          state: !lambda "return id(etor_a_reverse);"
      - sensor.template.publish:
          id: etor_b_reverse_sensor
          state: !lambda "return id(etor_b_reverse);"
      - sensor.template.publish:
          id: etor_signal_sensor
          state: !lambda "return id(etor_signal);"

      # Averages alone are not enough: reject clipped, noisy and inconsistent cycles.
      # Bench model: metric ≈ 6.6*R/(R+200kΩ); not a safety-rated wetness decision.
      - lambda: |-
          const float m = id(etor_signal);
          const float fd = id(etor_a_forward) - id(etor_b_forward);
          const float rd = id(etor_a_reverse) - id(etor_b_reverse);
          const float fs = id(etor_forward_diff_max) - id(etor_forward_diff_min);
          const float rs = id(etor_reverse_diff_max) - id(etor_reverse_diff_min);
          const bool finite = !id(etor_nonfinite_fault) &&
              std::isfinite(id(etor_a_forward)) && std::isfinite(id(etor_b_forward)) &&
              std::isfinite(id(etor_a_reverse)) && std::isfinite(id(etor_b_reverse)) &&
              std::isfinite(m) && std::isfinite(fs) && std::isfinite(rs);
          id(etor_resistance_kohm) = NAN;
          if (!finite || m < 0.0f || m >= 6.6f) {
            id(etor_state) = "INVALID_SAMPLE";
            id(etor_invalid_reason) = "NONFINITE_OR_RANGE";
          } else if (id(etor_rail_fault)) {
            id(etor_state) = "INVALID_SAMPLE";
            id(etor_invalid_reason) = "BOTH_INPUTS_SAME_RAIL";
          } else if (fs > 0.25f || rs > 0.25f) {
            id(etor_state) = "INVALID_SAMPLE";
            id(etor_invalid_reason) = "UNSTABLE_DIFFERENTIAL";
          } else if (fd < -0.05f || rd > 0.05f) {
            id(etor_state) = "INVALID_SAMPLE";
            id(etor_invalid_reason) = "POLARITY_MISMATCH";
          } else if (m < 0.020f) {
            // Only after ruling out rail saturation and phase inconsistency.
            id(etor_state) = "LOW_RESISTANCE";
          } else {
            const float r_kohm = 200.0f * m / (6.6f - m);
            if (r_kohm >= 0.5f && r_kohm <= 2500.0f) {
              id(etor_resistance_kohm) = r_kohm;
            }
            const bool thresholds_valid = id(etor_classification_enabled) &&
                id(etor_wet_on_metric) > 0.0f &&
                id(etor_dry_on_metric) > id(etor_wet_on_metric) &&
                id(etor_dry_on_metric) < 6.6f;
            if (!thresholds_valid) {
              id(etor_state) = "UNCALIBRATED";
            } else if (m <= id(etor_wet_on_metric)) {
              id(etor_state) = "WET";
            } else if (m >= id(etor_dry_on_metric)) {
              id(etor_state) = "DRY";
            } else if (id(etor_state) != "WET" && id(etor_state) != "DRY") {
              id(etor_state) = "UNCALIBRATED";
            }
          }
      - sensor.template.publish:
          id: etor_resistance_sensor
          state: !lambda "return id(etor_resistance_kohm);"
      - text_sensor.template.publish:
          id: etor_state_sensor
          state: !lambda "return id(etor_state);"

      # Preserve existing JSON fields; add quality diagnostics for each 5x2 cycle.
      - lambda: |-
          id(etor_sample_seq) += 1;
          ESP_LOGI("etor_bench",
            "ETOR_SAMPLE:{\"seq\":%u,"
            "\"adc_a_forward_v\":%.4f,"
            "\"adc_b_forward_v\":%.4f,"
            "\"adc_a_reverse_v\":%.4f,"
            "\"adc_b_reverse_v\":%.4f,"
            "\"metric\":%.6f,"
            "\"forward_spread_v\":%.4f,"
            "\"reverse_spread_v\":%.4f,"
            "\"samples_per_polarity\":5,"
            "\"invalid_reason\":\"%s\","
            "\"actual_state\":\"%s\"}",
            (unsigned int) id(etor_sample_seq),
            id(etor_a_forward), id(etor_b_forward),
            id(etor_a_reverse), id(etor_b_reverse),
            id(etor_signal),
            id(etor_forward_diff_max) - id(etor_forward_diff_min),
            id(etor_reverse_diff_max) - id(etor_reverse_diff_min),
            id(etor_invalid_reason).c_str(), id(etor_state).c_str());

button:
  - platform: restart
    name: "Restart controller"
