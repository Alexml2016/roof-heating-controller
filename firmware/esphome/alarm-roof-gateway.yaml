# Alarm & Roof Gateway — ETOR resistor-calibrated laboratory diagnostics, 2026-10-21
# Laboratory build: GPIO17/OneWire confirmed on CN3; excitation GPIO32/33 verified by bench response (check PCB revision).
# During bench tests disconnect mains/contactors and ETOR heater power.
substitutions:
  device_name: alarm-roof-gateway
  friendly_name: "Alarm & Roof Gateway"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_off: roof_contactor
      - switch.turn_off: etor_heater_relay
      - switch.turn_off: etor_excitation_a
      - switch.turn_off: etor_excitation_b

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: DEBUG

api:

ota:
  - platform: esphome

# Temporary Wi-Fi during laboratory testing.
# ethernet:
#   type: LAN8720
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18
#   clk:
#     pin: GPIO0
#     mode: CLK_OUT
#   phy_addr: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Alarm-Roof-Gateway"
    password: !secret fallback_ap_password

captive_portal:

globals:
  - id: etor_a_forward
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_b_forward
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_a_reverse
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_b_reverse
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_signal
    type: float
    restore_value: no
    initial_value: "0.0"
  # Sampling accumulators used only by the ETOR diagnostic cycle.
  - id: etor_sum_a
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_sum_b
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_good_samples
    type: int
    restore_value: no
    initial_value: "0"
  - id: etor_rail_samples
    type: int
    restore_value: no
    initial_value: "0"
  - id: etor_forward_rail_samples
    type: int
    restore_value: no
    initial_value: "0"
  - id: etor_reverse_rail_samples
    type: int
    restore_value: no
    initial_value: "0"
  - id: etor_sample_seq
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: etor_resistance_kohm
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: etor_state
    type: std::string
    restore_value: no
    initial_value: '"UNAVAILABLE"'
  # Deliberately disabled until real ETOR-55 wet/dry thresholds are approved.
  - id: etor_classification_enabled
    type: bool
    restore_value: no
    initial_value: "false"
  # Calibration parameters must be explicitly set before enabling classification.
  # With decreasing metric, WET is entered below wet_on; DRY above dry_on.
  - id: etor_wet_on_metric
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: etor_dry_on_metric
    type: float
    restore_value: no
    initial_value: "0.0"

switch:
  - platform: gpio
    id: roof_contactor
    name: "Roof heating contactor"
    pin: GPIO4
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: etor_heater_relay
    name: "ETOR-55 heater"
    pin: GPIO15
    restore_mode: ALWAYS_OFF

  # ETOR GPIO32/GPIO33 excitation has shown correct resistor-bench response; verify PCB connections on next revision.
  - platform: gpio
    id: etor_excitation_a
    internal: true
    pin: GPIO32
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: etor_excitation_b
    internal: true
    pin: GPIO33
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: "Alarm input"
    id: alarm_input
    device_class: problem
    pin:
      number: GPIO14
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: status
    name: "Controller online"

one_wire:
  # GPIO17 confirmed by scan of two DS18B20 sensors on CN3 (2026-10-21).
  - platform: gpio
    pin: GPIO17
    id: onewire_bus

sensor:
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x9a000000b176a128
    name: "Boiler temperature IN"
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x250000005219a128
    name: "Boiler temperature OUT"

    update_interval: 10s

  - platform: adc
    id: etor_a_adc
    internal: true
    pin: GPIO35
    attenuation: 12db
    samples: 4
    sampling_mode: avg
    update_interval: never

  - platform: adc
    id: etor_b_adc
    internal: true
    pin: GPIO36
    attenuation: 12db
    samples: 4
    sampling_mode: avg
    update_interval: never

  - platform: template
    id: etor_a_forward_sensor
    name: "ETOR A forward voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_a_forward);

  - platform: template
    id: etor_b_forward_sensor
    name: "ETOR B forward voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_b_forward);

  - platform: template
    id: etor_a_reverse_sensor
    name: "ETOR A reverse voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_a_reverse);

  - platform: template
    id: etor_b_reverse_sensor
    name: "ETOR B reverse voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_b_reverse);

  - platform: template
    id: etor_signal_sensor
    name: "ETOR differential signal"
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      return id(etor_signal);

  - platform: template
    id: etor_resistance_sensor
    name: "ETOR electrode resistance (estimated)"
    unit_of_measurement: "kΩ"
    icon: "mdi:resistor"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return id(etor_resistance_kohm);

  - platform: uptime
    name: "Controller uptime"
    update_interval: 60s

text_sensor:
  - platform: template
    id: etor_state_sensor
    name: "ETOR moisture diagnostic state"
    icon: "mdi:water-check"
    update_interval: never
    lambda: |-
      return id(etor_state);

interval:
  - interval: 10s
    then:
      - switch.turn_off: etor_excitation_a
      - switch.turn_off: etor_excitation_b
      - delay: 100ms

      # Sampling note: 40 samples separated by 5 ms span about 200 ms,
      # or roughly ten periods of 50 Hz mains. This reduces pickup, but
      # ESPHome scheduling is not phase-locked and cannot guarantee a notch.
      # 300 ms settle time accommodates the analog RC and wet electrodes.
      # Each ADC update also averages four hardware samples.
      # Forward: GPIO32 HIGH, GPIO33 LOW.
      - switch.turn_on: etor_excitation_a
      - delay: 300ms
      - lambda: |-
          id(etor_sum_a) = 0.0f;
          id(etor_sum_b) = 0.0f;
          id(etor_good_samples) = 0;
          id(etor_rail_samples) = 0;
      - repeat:
          count: 40
          then:
            - component.update: etor_a_adc
            - component.update: etor_b_adc
            - lambda: |-
                const float a = id(etor_a_adc).state;
                const float b = id(etor_b_adc).state;
                // Both ADC inputs at the SAME rail is not a valid low-R
                // measurement. Avoid interpreting saturation as wetness.
                const bool rail = ((a <= 0.20f && b <= 0.20f) ||
                                   (a >= 3.10f && b >= 3.10f));
                if (rail) {
                  id(etor_rail_samples)++;
                } else if (std::isfinite(a) && std::isfinite(b)) {
                  id(etor_sum_a) += a;
                  id(etor_sum_b) += b;
                  id(etor_good_samples)++;
                }
            - delay: 5ms
      - lambda: |-
          id(etor_forward_rail_samples) = id(etor_rail_samples);
          if (id(etor_good_samples) >= 38 &&
              id(etor_rail_samples) <= 2) {
            id(etor_a_forward) = id(etor_sum_a) / id(etor_good_samples);
            id(etor_b_forward) = id(etor_sum_b) / id(etor_good_samples);
          } else {
            id(etor_a_forward) = NAN;
            id(etor_b_forward) = NAN;
          }

      # Reverse: GPIO32 LOW, GPIO33 HIGH.
      - switch.turn_off: etor_excitation_a
      - switch.turn_on: etor_excitation_b
      - delay: 300ms
      - lambda: |-
          id(etor_sum_a) = 0.0f;
          id(etor_sum_b) = 0.0f;
          id(etor_good_samples) = 0;
          id(etor_rail_samples) = 0;
      - repeat:
          count: 40
          then:
            - component.update: etor_a_adc
            - component.update: etor_b_adc
            - lambda: |-
                const float a = id(etor_a_adc).state;
                const float b = id(etor_b_adc).state;
                const bool rail = ((a <= 0.20f && b <= 0.20f) ||
                                   (a >= 3.10f && b >= 3.10f));
                if (rail) {
                  id(etor_rail_samples)++;
                } else if (std::isfinite(a) && std::isfinite(b)) {
                  id(etor_sum_a) += a;
                  id(etor_sum_b) += b;
                  id(etor_good_samples)++;
                }
            - delay: 5ms
      - lambda: |-
          id(etor_reverse_rail_samples) = id(etor_rail_samples);
          if (id(etor_good_samples) >= 38 &&
              id(etor_rail_samples) <= 2) {
            id(etor_a_reverse) = id(etor_sum_a) / id(etor_good_samples);
            id(etor_b_reverse) = id(etor_sum_b) / id(etor_good_samples);
          } else {
            id(etor_a_reverse) = NAN;
            id(etor_b_reverse) = NAN;
          }
          const float forward = id(etor_a_forward) - id(etor_b_forward);
          const float reverse = id(etor_a_reverse) - id(etor_b_reverse);
          id(etor_signal) = std::abs(forward - reverse);

      # Disable excitation between measurement cycles.
      - switch.turn_off: etor_excitation_b

      - sensor.template.publish:
          id: etor_a_forward_sensor
          state: !lambda "return id(etor_a_forward);"
      - sensor.template.publish:
          id: etor_b_forward_sensor
          state: !lambda "return id(etor_b_forward);"
      - sensor.template.publish:
          id: etor_a_reverse_sensor
          state: !lambda "return id(etor_a_reverse);"
      - sensor.template.publish:
          id: etor_b_reverse_sensor
          state: !lambda "return id(etor_b_reverse);"
      - sensor.template.publish:
          id: etor_signal_sensor
          state: !lambda "return id(etor_signal);"

      # Bench-calibrated equivalent resistance; not a safety-rated wetness decision.
      # Model: metric ≈ 6.6*R/(R+200kΩ) for two 100kΩ series resistors.
      # Real R<1kΩ cannot be resolved accurately: show NaN, mark LOW_RESISTANCE.
      # 0Ω jumper and 42Ω are indistinguishable by this ADC setup.
      - lambda: |-
          const float m = id(etor_signal);
          const bool valid = std::isfinite(id(etor_a_forward)) &&
                             std::isfinite(id(etor_b_forward)) &&
                             std::isfinite(id(etor_a_reverse)) &&
                             std::isfinite(id(etor_b_reverse)) &&
                             std::isfinite(m) &&
                             id(etor_a_forward) >= 0.0f && id(etor_a_forward) <= 3.3f &&
                             id(etor_b_forward) >= 0.0f && id(etor_b_forward) <= 3.3f &&
                             id(etor_a_reverse) >= 0.0f && id(etor_a_reverse) <= 3.3f &&
                             id(etor_b_reverse) >= 0.0f && id(etor_b_reverse) <= 3.3f &&
                             m >= 0.0f && m < 6.6f;
          id(etor_resistance_kohm) = NAN;
          if (!valid) {
            id(etor_state) = "INVALID_SAMPLE";
          } else if (m < 0.020f) {
            // A genuine very-low-R bridge should bring the two sense nodes
            // near mid-supply (~1.65 V), not drive both to an ADC rail.
            const bool mid_supply =
                id(etor_a_forward) > 1.0f && id(etor_a_forward) < 2.3f &&
                id(etor_b_forward) > 1.0f && id(etor_b_forward) < 2.3f &&
                id(etor_a_reverse) > 1.0f && id(etor_a_reverse) < 2.3f &&
                id(etor_b_reverse) > 1.0f && id(etor_b_reverse) < 2.3f;
            id(etor_state) = mid_supply ? "LOW_RESISTANCE" : "INVALID_SAMPLE";
          } else {
            const float r_kohm = 200.0f * m / (6.6f - m);
            // Approximate range proven by resistor bench: 1kΩ ... 2.2MΩ.
            // Do not report fictitious precision outside the verified range.
            if (r_kohm >= 0.5f && r_kohm <= 2500.0f) {
              id(etor_resistance_kohm) = r_kohm;
            }
            // Only classify real wet/dry states when explicitly calibrated.
            const bool thresholds_valid = id(etor_classification_enabled) &&
                id(etor_wet_on_metric) > 0.0f &&
                id(etor_dry_on_metric) > id(etor_wet_on_metric) &&
                id(etor_dry_on_metric) < 6.6f;
            if (!thresholds_valid) {
              id(etor_state) = "UNCALIBRATED";
            } else if (m <= id(etor_wet_on_metric)) {
              id(etor_state) = "WET";
            } else if (m >= id(etor_dry_on_metric)) {
              id(etor_state) = "DRY";
            } else if (id(etor_state) != "WET" && id(etor_state) != "DRY") {
              id(etor_state) = "UNCALIBRATED";
            }
          }
      - sensor.template.publish:
          id: etor_resistance_sensor
          state: !lambda "return id(etor_resistance_kohm);"
      - text_sensor.template.publish:
          id: etor_state_sensor
          state: !lambda "return id(etor_state);"

      # One ETOR_SAMPLE JSON object per completed forward+reverse cycle.
      # actual_state comes from the classifier above (gated until field calibration).
      - lambda: |-
          id(etor_sample_seq) += 1;
          if (std::isfinite(id(etor_a_forward)) &&
              std::isfinite(id(etor_b_forward)) &&
              std::isfinite(id(etor_a_reverse)) &&
              std::isfinite(id(etor_b_reverse)) &&
              std::isfinite(id(etor_signal))) {
            ESP_LOGI("etor_bench",
              "ETOR_SAMPLE:{\"seq\":%u,"
              "\"adc_a_forward_v\":%.4f,"
              "\"adc_b_forward_v\":%.4f,"
              "\"adc_a_reverse_v\":%.4f,"
              "\"adc_b_reverse_v\":%.4f,"
              "\"metric\":%.6f,"
              "\"actual_state\":\"%s\"}",
              (unsigned int) id(etor_sample_seq),
              id(etor_a_forward), id(etor_b_forward),
              id(etor_a_reverse), id(etor_b_reverse),
              id(etor_signal), id(etor_state).c_str());
          } else {
            ESP_LOGW("etor_bench", "ETOR_INVALID_SAMPLE seq=%u forward_rail=%d/40 reverse_rail=%d/40",
              (unsigned int) id(etor_sample_seq), id(etor_forward_rail_samples), id(etor_reverse_rail_samples));
          }

button:
  - platform: restart
    name: "Restart controller"
